name: CI & Safety Hygiene

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  safety-and-hygiene:
    name: Security, Secrets & Path Hygiene
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Repository Safety & Manifest Integrity Checker
        run: python scripts/check_repo_safety.py

  test:
    name: Unit & Integration Tests (Python 3.10)
    runs-on: windows-latest
    needs: safety-and-hygiene

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest Test Suite
        run: pytest
